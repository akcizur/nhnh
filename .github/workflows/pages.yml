name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Test and build portfolio
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore V6 source on initial upload
        shell: bash
        run: |
          if [[ ! -f package.json ]]; then
            test -f .upload/source.tar.gz.b64 || {
              echo "::error::Portfolio source is missing."
              exit 1
            }
            base64 --decode .upload/source.tar.gz.b64 > /tmp/ruzickajakub-source.tar.gz
            tar -xzf /tmp/ruzickajakub-source.tar.gz --no-same-owner -C .
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

  sync-source:
    name: Commit unpacked source files
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Unpack and commit source tree on first deployment
        shell: bash
        run: |
          if [[ -f package.json || ! -f .upload/source.tar.gz.b64 ]]; then
            echo "Source tree is already present; no sync needed."
            exit 0
          fi

          base64 --decode .upload/source.tar.gz.b64 > /tmp/ruzickajakub-source.tar.gz
          tar -xzf /tmp/ruzickajakub-source.tar.gz --no-same-owner -C .
          rm -rf .upload

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "chore: add RUZICKAJAKUB V6 source tree"
          git push origin HEAD:main
