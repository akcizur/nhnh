name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      has_source: ${{ steps.detect.outputs.has_source }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check for source bundle
        id: detect
        shell: bash
        run: |
          if compgen -G ".source-parts/part*.b64" > /dev/null; then
            echo "has_source=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_source=false" >> "$GITHUB_OUTPUT"
            echo "Source bundle is not present yet; build and deploy are skipped."
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.has_source == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: bash
        run: |
          cat .source-parts/part*.b64 | base64 --decode > /tmp/site-source.tar.gz
          tar -tzf /tmp/site-source.tar.gz >/dev/null
          tar -xzf /tmp/site-source.tar.gz --overwrite

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
