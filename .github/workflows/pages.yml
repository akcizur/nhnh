name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Test and build portfolio
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: TypeScript check
        run: npm run lint

      - name: Build static site
        run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  check-pages:
    name: Check GitHub Pages configuration
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Detect Pages configuration
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl --silent --show-error --location \
            --output "$RUNNER_TEMP/pages.json" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")"

          if [[ "$status" == "200" ]]; then
            build_type="$(node -e "const p=require(process.argv[1]); process.stdout.write(p.build_type || 'legacy')" "$RUNNER_TEMP/pages.json")"
            if [[ "$build_type" == "workflow" ]]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              {
                echo "### GitHub Pages configuration"
                echo "Pages is enabled and configured to use GitHub Actions."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice::GitHub Pages exists but is not configured to use GitHub Actions. Open Settings → Pages → Build and deployment → Source and select GitHub Actions."
              {
                echo "### Deployment skipped"
                echo "The build and tests run normally, but Pages is currently configured for branch-based deployment."
                echo "In [Settings → Pages](https://github.com/$GITHUB_REPOSITORY/settings/pages), select **GitHub Actions** as the source, then rerun this workflow."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [[ "$status" == "404" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for this repository yet. Build and tests will run; deployment is skipped."
            {
              echo "### Deployment skipped — one-time setup required"
              echo "The tests and production build still run. GitHub does not allow this workflow token to create the Pages site automatically."
              echo "Open [Settings → Pages](https://github.com/$GITHUB_REPOSITORY/settings/pages) and choose **GitHub Actions** under **Build and deployment → Source**."
              echo "After saving that setting, rerun this workflow. Future pushes to `main` will build and deploy automatically."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$RUNNER_TEMP/pages.json"
            echo "::error::Unable to check GitHub Pages configuration (HTTP $status)."
            exit 1
          fi

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, check-pages]
    if: needs.check-pages.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
